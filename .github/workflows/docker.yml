# Сборка образа vastgame-desktop (папка docker/) и публикация в GitHub Container Registry:
# ghcr.io/wetfoxx/vastgame-desktop:latest и :<коммит>. Запускается при изменениях в docker/ или вручную.
name: docker

on:
  push:
    branches: [main]
    paths: ["docker/**", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker
          push: true
          tags: |
            ghcr.io/wetfoxx/vastgame-desktop:latest
            ghcr.io/wetfoxx/vastgame-desktop:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
