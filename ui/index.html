<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vastgame</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header>
    <div class="brand">vastgame</div>
    <div class="header-right">
      <span class="updated" id="updated" data-i18n="app.loading"></span>
      <select id="lang" aria-label="Language"></select>
    </div>
  </header>

  <!-- ===== Главный экран ===== -->
  <main id="screen-main">
    <section class="card attention" id="setup-banner" hidden>
      <div data-i18n="setup.banner"></div>
      <button class="primary" id="setup-banner-open" data-i18n="setup.open"></button>
    </section>
    <section class="card" id="balance-card">
      <div class="label" data-i18n="balance.label"></div>
      <div class="big" id="balance">—</div>
      <div class="sub" id="balance-sub"></div>
    </section>

    <section class="card" id="machine-card">
      <div class="status-row">
        <span class="dot" id="dot"></span>
        <div>
          <div class="title" id="status-title">—</div>
          <div class="sub" id="status-text"></div>
        </div>
      </div>
      <div class="machine" id="machine" hidden></div>
      <div class="sub" id="session-line" hidden></div>
      <div class="links" id="links" hidden>
        <div class="ml-row">
          <button class="primary" id="ml-start" data-i18n="moonlight.start"></button>
          <select id="ml-app" aria-label="Sunshine app" data-i18n-title="moonlight.app"></select>
        </div>
        <div class="sub" id="ml-note" hidden></div>
        <div class="stream-set" id="stream-set" hidden>
          <label><span class="label" data-i18n="stream.resolution"></span><select id="stream-res"></select></label>
          <label><span class="label" data-i18n="stream.bitrate"></span><select id="stream-bitrate"></select></label>
        </div>
        <div class="sub" id="stream-hint" hidden></div>
        <div class="link-row">
          <div>
            <div class="label" data-i18n="links.moonlight"></div>
            <code id="moonlight"></code>
          </div>
          <button class="small" id="copy-moonlight" data-i18n="btn.copy"></button>
        </div>
        <div class="link-row">
          <div class="label" data-i18n="links.sunshine"></div>
          <button class="small" id="open-sunshine" data-i18n="btn.open"></button>
        </div>
      </div>
    </section>

    <div class="actions">
      <button class="primary" id="play" disabled data-i18n="btn.play"></button>
      <button id="stop" disabled data-i18n="btn.stop"></button>
    </div>

    <div class="error" id="error" hidden></div>
    <div class="actions">
      <button id="open-games" data-i18n="games.open"></button>
      <button id="open-history" data-i18n="history.open"></button>
      <button id="open-setup" data-i18n="setup.open"></button>
    </div>
    <div class="danger-row"><button class="link danger" id="emergency" hidden data-i18n="btn.emergency"></button></div>
  </main>

  <!-- ===== Выбор машины ===== -->
  <main id="screen-offers" hidden>
    <h1 data-i18n="offers.title"></h1>
    <div class="sub" id="offers-summary" data-i18n="offers.loading"></div>
    <div class="note" data-i18n="offers.latency"></div>
    <div class="note" id="offers-last" hidden></div>
    <section class="card disk-card">
      <div class="disk-row"><span class="label" data-i18n="disk.title"></span><b id="disk-value"></b></div>
      <input type="range" id="disk" min="50" max="1000" step="10" value="100">
      <div class="sub" data-i18n="disk.hint"></div>
    </section>
    <section class="card filters-card">
      <div class="filters">
        <label><span class="label" data-i18n="filter.countries"></span>
          <button id="f-countries-btn" class="filter-btn"></button></label>
        <label><span class="label" data-i18n="filter.speed"></span><select id="f-speed"></select></label>
        <label><span class="label" data-i18n="filter.ping"></span><select id="f-ping"></select></label>
      </div>
      <div class="countries" id="f-countries" hidden>
        <div class="countries-head"><button id="f-countries-all" data-i18n="filter.countries.all"></button></div>
        <div class="countries-list" id="f-countries-list"></div>
      </div>
    </section>
    <section class="card table-card">
      <table id="offers-table">
        <thead>
          <tr>
            <th></th>
            <th data-i18n="col.gpu"></th>
            <th data-i18n="col.country"></th>
            <th class="num sortable" data-sort="ping"><span data-i18n="col.ping"></span><span class="arrow"></span></th>
            <th class="num sortable" data-sort="net"><span data-i18n="col.net"></span><span class="arrow"></span></th>
            <th class="num sortable" data-sort="price"><span data-i18n="col.price"></span><span class="arrow"></span></th>
            <th class="num sortable" data-sort="rel"><span data-i18n="col.reliability"></span><span class="arrow"></span></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="pager" id="offers-pager" hidden>
        <button id="page-prev">‹</button><span id="page-info"></span><button id="page-next">›</button>
      </div>
    </section>
    <section class="card sync-card">
      <div class="label" data-i18n="sync.title"></div>
      <label class="switch-row"><input type="checkbox" id="sync-steam_games">
        <span><b data-i18n="sync.steam_games"></b><span class="sub" data-i18n="sync.steam_games.hint"></span></span></label>
      <label class="switch-row"><input type="checkbox" id="sync-other_games">
        <span><b data-i18n="sync.other_games"></b><span class="sub" data-i18n="sync.other_games.hint"></span></span></label>
      <label class="switch-row"><input type="checkbox" id="sync-saves">
        <span><b data-i18n="sync.saves"></b><span class="sub" data-i18n="sync.saves.hint"></span></span></label>
    </section>
    <div class="error" id="offers-error" hidden></div>
    <div class="actions">
      <button class="primary" id="rent" disabled data-i18n="offers.rent"></button>
      <button id="offers-cancel" data-i18n="btn.cancel"></button>
    </div>
  </main>

  <!-- ===== Настройка ===== -->
  <!-- ===== Простая настройка: один шаг — одно действие ===== -->
  <main id="screen-wizard" hidden>
    <ol class="wiz-steps" id="wiz-steps"></ol>
    <section class="card wiz-card">
      <h1 id="wiz-title"></h1>
      <div class="wiz-text" id="wiz-text"></div>
      <div class="wiz-body" id="wiz-body"></div>
      <div class="wiz-status" id="wiz-status" hidden></div>
    </section>
    <div class="actions"><button class="primary" id="wiz-next" hidden></button></div>
    <div class="wiz-foot"><button class="link" id="wiz-advanced" data-i18n="wizard.advanced"></button></div>
  </main>

  <main id="screen-setup" hidden>
    <h1 data-i18n="setup.title"></h1>
    <div class="sub" id="setup-summary" data-i18n="setup.loading"></div>
    <section class="card">
      <ul class="setup-steps" id="setup-steps"></ul>
    </section>
    <div class="error" id="setup-error" hidden></div>
    <section class="card reset-card">
      <div class="label" data-i18n="setup.reset.title"></div>
      <div class="sub" data-i18n="setup.reset.text"></div>
      <button class="small danger" id="setup-reset" data-i18n="setup.reset.button"></button>
    </section>
    <div class="actions">
      <button id="setup-wizard" data-i18n="wizard.open"></button>
      <button id="setup-recheck" data-i18n="setup.recheck"></button>
      <button class="primary" id="setup-back" data-i18n="btn.back"></button>
    </div>
  </main>

  <!-- ===== История и траты ===== -->
  <main id="screen-history" hidden>
    <h1 data-i18n="history.title"></h1>
    <div class="tabs" id="history-tabs"></div>
    <div class="sub" id="history-summary" data-i18n="history.loading"></div>
    <section class="card stats" id="history-stats" hidden>
      <div><div class="label" data-i18n="history.spent"></div><div class="big" id="h-spent"></div></div>
      <div><div class="label" data-i18n="history.hours"></div><div class="big" id="h-hours"></div></div>
      <div><div class="label" data-i18n="history.sessions"></div><div class="big" id="h-count"></div></div>
      <div><div class="label" data-i18n="history.per_hour"></div><div class="big" id="h-per-hour"></div></div>
    </section>
    <div class="sub" id="history-breakdown"></div>
    <section class="card table-card" id="history-card" hidden>
      <table id="history-table">
        <thead><tr>
          <th data-i18n="col.date"></th><th data-i18n="col.machine"></th>
          <th class="num" data-i18n="col.hours"></th><th class="num" data-i18n="col.cost"></th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </section>
    <div class="note" id="history-other" hidden><span></span> <a href="#" id="history-other-toggle"></a></div>
    <div class="note" data-i18n="history.note"></div>
    <div class="error" id="history-error" hidden></div>
    <div class="actions"><button class="primary" id="history-back" data-i18n="btn.back"></button></div>
  </main>

  <!-- ===== Игры в облаке ===== -->
  <main id="screen-games" hidden>
    <h1 data-i18n="games.title"></h1>
    <div class="sub" id="games-summary" data-i18n="games.loading"></div>
    <section class="card attention" id="games-ts" hidden>
      <div class="title" data-i18n="tailscale.title"></div>
      <div class="sub" data-i18n="tailscale.text"></div>
      <button class="primary" id="games-ts-open" data-i18n="tailscale.open"></button>
    </section>
    <input type="search" id="games-search" data-i18n-placeholder="games.search" hidden>
    <section class="card table-card" id="games-card" hidden>
      <table id="games-table">
        <thead>
          <tr>
            <th data-i18n="col.kind"></th>
            <th data-i18n="col.title"></th>
            <th class="num" data-i18n="col.size"></th>
            <th class="num" data-i18n="col.changed"></th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
    <div class="note" id="games-service"></div>
    <div class="note" id="games-status" hidden></div>
    <div class="error" id="games-error" hidden></div>
    <div class="actions">
      <button id="games-back" data-i18n="btn.back"></button>
    </div>
  </main>

  <!-- ===== Ход операции (запуск или завершение) ===== -->
  <main id="screen-progress" hidden>
    <h1 id="progress-title"></h1>
    <div class="sub" id="progress-elapsed"></div>
    <div class="warn-line" id="progress-alert" hidden></div>
    <section class="card attention" id="tailscale-box" hidden>
      <div class="title" data-i18n="tailscale.title"></div>
      <div class="sub" data-i18n="tailscale.text"></div>
      <button class="primary" id="tailscale-open" data-i18n="tailscale.open"></button>
    </section>
    <section class="card">
      <ol class="stages" id="stages"></ol>
    </section>
    <section class="card" id="archives-card" hidden>
      <ul class="archives" id="archives"></ul>
    </section>
    <div class="note" id="progress-note"></div>
    <section class="card" id="progress-result" hidden></section>
    <div class="error" id="progress-error" hidden></div>
    <details class="details">
      <summary data-i18n="progress.details"></summary>
      <pre id="progress-log"></pre>
    </details>
    <div class="actions">
      <button class="primary" id="progress-offers" hidden data-i18n="offers.back_to_list"></button>
      <button class="primary" id="progress-back" hidden data-i18n="btn.back"></button>
      <button class="danger" id="progress-cancel" hidden data-i18n="progress.cancel"></button>
    </div>
  </main>

  <!-- ===== Вопрос (да/нет) ===== -->
  <div class="modal" id="modal" hidden>
    <div class="dialog">
      <div class="title" id="modal-title"></div>
      <div class="modal-text" id="modal-text"></div>
      <div class="actions">
        <button class="primary" id="modal-yes"></button>
        <button id="modal-no"></button>
      </div>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
