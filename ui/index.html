<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VastGame</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header>
    <div class="brand" id="brand" data-i18n-title="app.home"><img class="brand-mark" src="logo-mark.png" alt=""><img class="brand-word" src="logo-word.png" alt="VastGame"><span class="version" id="app-version"></span></div>
    <!-- Разделы — значками справа (подписи — во всплывающих подсказках) -->
    <nav class="header-right icons">
      <button class="icon-btn labeled" id="open-library"><svg viewBox="0 0 24 24"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16.5 4.5l3.8 1-4 15-3.8-1z"/></svg><span data-i18n="library.open"></span></button>
      <button class="icon-btn" id="open-games" data-i18n-title="games.open"><svg viewBox="0 0 24 24"><path d="M6 11h4M8 9v4M15 12h.01M18 10h.01"/><rect x="2" y="6" width="20" height="12" rx="6"/></svg></button>
      <button class="icon-btn" id="open-history" data-i18n-title="history.open"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></button>
      <button class="icon-btn" id="open-setup" data-i18n-title="setup.open"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </nav>
  </header>

  <!-- ===== Главный экран ===== -->
  <main id="screen-main">
    <section class="card update" id="update-banner" hidden>
      <div class="update-text">
        <div class="title" id="update-title"></div>
        <div class="sub" id="update-state" hidden></div>
        <button class="link" id="update-notes" data-i18n="update.notes"></button>
      </div>
      <button class="primary" id="update-go" data-i18n="update.button"></button>
    </section>
    <section class="card attention" id="setup-banner" hidden>
      <div data-i18n="setup.banner"></div>
      <button class="primary" id="setup-banner-open" data-i18n="setup.open"></button>
    </section>
    <!-- Вопросы машины: новая игра — синхронизировать? игру удалили — удалить из облака? -->
    <section class="card asks-card" id="asks-card" hidden>
      <div class="label" data-i18n="ask.main.title"></div>
      <ul class="asks" id="asks-list"></ul>
    </section>

    <!-- Машина и баланс — одна карточка. Машины нет — крупно баланс и «Играть» (класс empty) -->
    <section class="card hero" id="machine-card">
      <div class="hero-top">
        <div class="hero-main">
          <div class="hero-status"><span class="dot" id="dot"></span><span class="title" id="status-title">—</span></div>
          <div class="sub" id="status-text"></div>
          <div class="facts" id="facts" hidden></div>
        </div>
        <div class="money" id="balance-card">
          <div class="big" id="balance">—</div>
          <div class="sub" id="balance-sub"></div>
        </div>
      </div>
      <!-- Игра из библиотеки на машине: вход в Steam → скачивание → запуск (запись play wolf-setup.sh v4.8) -->
      <div class="play-box" id="play-box" hidden></div>
      <div class="task-row" id="task-row" hidden>
        <span class="task-text" id="task-text"></span>
        <span class="task-buttons">
          <button class="small" id="task-replace" data-i18n="task.replace"></button>
          <button class="small" id="task-show" data-i18n="task.show"></button>
        </span>
      </div>
      <div class="links" id="links" hidden>
        <div class="ml-row">
          <button class="primary" id="ml-start" data-i18n="moonlight.start"></button>
          <select id="ml-app" aria-label="Sunshine app" data-i18n-title="moonlight.app"></select>
        </div>
        <div class="sub" id="ml-note" hidden></div>
        <div class="row-link" id="params-row">
          <span id="stream-summary"></span>
          <button class="link" id="params-toggle" data-i18n="params.open"></button>
        </div>
        <!-- Параметры: разрешение и битрейт; ручное подключение (обычно не нужно — связывает VastGame сам) -->
        <div class="params" id="params" hidden>
          <div class="stream-set" id="stream-set" hidden>
            <label><span class="label" data-i18n="stream.resolution"></span><select id="stream-res"></select></label>
            <label><span class="label" data-i18n="stream.bitrate"></span><select id="stream-bitrate"></select></label>
          </div>
          <div class="sub" id="stream-hint" hidden></div>
          <div class="label params-cap" data-i18n="params.manual"></div>
          <div class="link-row">
            <div>
              <div class="sub" data-i18n="links.moonlight"></div>
              <code id="moonlight"></code>
            </div>
            <button class="small" id="copy-moonlight" data-i18n="btn.copy"></button>
          </div>
          <div class="link-row">
            <div class="sub" data-i18n="links.sunshine"></div>
            <button class="small" id="open-sunshine" data-i18n="btn.open"></button>
          </div>
          <div class="link-row">
            <div>
              <div class="sub" data-i18n="params.login"></div>
              <code id="sunshine-login" hidden></code>
            </div>
            <button class="small" id="show-login" data-i18n="params.login.show"></button>
          </div>
        </div>
      </div>
      <div class="live" id="live" hidden>
        <div class="label" data-i18n="live.title"></div>
        <ul class="archives" id="live-archives"></ul>
      </div>
      <button class="primary" id="play" disabled hidden data-i18n="btn.play"></button>
    </section>

    <div class="foot" id="foot" hidden>
      <button class="link danger" id="emergency" data-i18n="btn.emergency"></button>
      <button id="stop" disabled data-i18n="btn.stop"></button>
    </div>
    <!-- Библиотека Steam на главном: обложки последних игр; Steam не привязан — «Войти в Steam» -->
    <section class="card lib-card" id="lib-card" hidden>
      <div class="lib-card-top">
        <div><div class="title" data-i18n="library.main.title"></div><div class="sub" id="lib-card-sub"></div></div>
        <button class="small primary" id="lib-card-open" data-i18n="library.main.all"></button>
      </div>
      <div class="lib-strip" id="lib-strip"></div>
    </section>
    <div class="error" id="error" hidden></div>
  </main>

  <!-- ===== Выбор машины ===== -->
  <main id="screen-offers" hidden>
    <h1 data-i18n="offers.title"></h1>
    <div class="stale-note" data-i18n="app.updating"></div>
    <!-- Игра из библиотеки: её скачает и запустит Steam на машине; аккаунт — если игра есть на нескольких -->
    <section class="card offers-game" id="offers-game" hidden></section>
    <div class="tabs" role="tablist">
      <button id="tab-docker" role="tab" data-i18n="offers.mode.docker"></button>
      <button id="tab-kvm" role="tab" data-i18n="offers.mode.kvm"></button>
      <button class="tabs-refresh" id="offers-refresh" data-i18n="offers.refresh"></button>
    </div>
    <div class="note" id="offers-docker-note" data-i18n="offers.mode.docker_note" hidden></div>
    <!-- Каталог во время запуска: какая машина запускается (с ней сравниваются цена и пинг в списке) -->
    <section class="card attention replace-card" id="offers-current" hidden></section>
    <!-- Что синхронизировать: одна строка на игру (её файлы и сохранения вместе), выбор запоминается -->
    <section class="card sync-card" id="sync-card">
      <div class="stale-note" data-i18n="app.updating"></div>
      <div class="sync-head">
        <div class="sync-head-text">
          <div class="sync-title" data-i18n="sync.title"></div>
          <div class="sync-summary" id="sync-summary" data-i18n="sync.loading"></div>
          <div class="sync-covers" id="sync-covers"></div>
        </div>
        <button class="small primary" id="sync-toggle" data-i18n="sync.edit" hidden></button>
      </div>
      <div class="sync-body" id="sync-body" hidden>
      <div class="sync-cols" id="sync-cols" hidden><span></span><span></span><span data-i18n="sync.col.game"></span><span data-i18n="sync.col.saves"></span></div>
      <ul class="sync-list" id="sync-list"></ul>
      </div>
      <div class="note" id="sync-note" hidden></div>
    </section>
    <!-- Фильтры — одной строкой; включённый подсвечен. Диск, страны, видеокарты — панелью под строкой -->
    <div class="filter-chips">
      <button class="chip" id="f-disk-btn"><span data-i18n="disk.chip"></span> <b id="disk-value"></b></button>
      <button class="chip" id="f-countries-btn"></button>
      <button class="chip" id="f-gpus-btn"></button>
      <select class="chip" id="f-speed" data-i18n-title="filter.speed"></select>
      <select class="chip" id="f-ping" data-i18n-title="filter.ping"></select>
      <select class="chip" id="f-rel" data-i18n-title="filter.rel.title"></select>
      <select class="chip" id="f-traffic" hidden data-i18n-title="filter.traffic"></select>
    </div>
    <section class="card pop disk-card" id="f-disk" hidden>
      <input type="range" id="disk" min="50" max="1000" step="10" value="100">
      <div class="sub" data-i18n="disk.hint"></div>
    </section>
    <section class="card pop countries" id="f-countries" hidden>
      <div class="countries-head"><button id="f-countries-all" data-i18n="filter.countries.all"></button></div>
      <div class="countries-list" id="f-countries-list"></div>
    </section>
    <section class="card pop countries" id="f-gpus" hidden>
      <div class="countries-head"><button id="f-gpus-all" data-i18n="filter.gpus.all"></button></div>
      <div class="countries-list" id="f-gpus-list"></div>
    </section>
    <div class="sub" id="offers-summary" data-i18n="offers.loading"></div>
    <div class="note" id="offers-last" hidden></div>
    <section class="card table-card">
      <table id="offers-table">
        <thead>
          <tr>
            <th></th>
            <th class="sortable" data-sort="gpu"><span data-i18n="col.gpu"></span><span class="arrow"></span></th>
            <th data-i18n="col.country"></th>
            <th class="num sortable" data-sort="ping"><span data-i18n="col.ping"></span><span class="arrow"></span></th>
            <th class="num sortable" data-sort="net"><span data-i18n="col.net"></span><span class="arrow"></span></th>
            <th class="num sortable col-traffic" data-sort="traffic"><span data-i18n="col.traffic"></span><span class="arrow"></span><span class="unit" data-i18n="col.traffic.unit"></span></th>
            <th class="num sortable" data-sort="price"><span data-i18n="col.price"></span><span class="arrow"></span></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="pager" id="offers-pager" hidden>
        <button id="page-prev">‹</button><span id="page-info"></span><button id="page-next">›</button>
      </div>
    </section>
    <div class="error" id="offers-error" hidden></div>
    <div class="actions">
      <button class="primary" id="rent" disabled data-i18n="offers.rent"></button>
      <button class="cancel" id="offers-cancel" data-i18n="btn.cancel"></button>
    </div>
  </main>

  <!-- ===== Настройка ===== -->
  <!-- ===== Простая настройка: один шаг — одно действие ===== -->
  <main id="screen-wizard" hidden>
    <ol class="wiz-steps" id="wiz-steps"></ol>
    <section class="card wiz-card">
      <h1 id="wiz-title"></h1>
      <div class="wiz-text" id="wiz-text"></div>
      <div class="wiz-body" id="wiz-body"></div>
      <div class="wiz-status" id="wiz-status" hidden></div>
    </section>
    <div class="actions"><button class="primary" id="wiz-next" hidden></button></div>
    <div class="wiz-foot"><button class="link" id="wiz-advanced" data-i18n="wizard.advanced"></button></div>
  </main>

  <main id="screen-setup" hidden>
    <h1 data-i18n="setup.title"></h1>
    <div class="stale-note" data-i18n="app.updating"></div>
    <div class="sub" id="setup-summary" data-i18n="setup.loading"></div>
    <section class="card">
      <ul class="setup-steps" id="setup-steps"></ul>
    </section>
    <div class="error" id="setup-error" hidden></div>
    <section class="card steam-card">
      <div class="label" data-i18n="steam.accounts"></div>
      <div class="steam-accounts" id="setup-steam"></div>
    </section>
    <section class="card lang-card">
      <span class="label">Language · Язык · Idioma</span>
      <select id="lang" aria-label="Language"></select>
    </section>
    <section class="card reset-card">
      <div class="label" data-i18n="setup.reset.title"></div>
      <div class="sub" data-i18n="setup.reset.text"></div>
      <button class="small danger" id="setup-reset" data-i18n="setup.reset.button"></button>
    </section>
    <div class="actions">
      <button id="setup-wizard" data-i18n="wizard.open"></button>
      <button id="setup-recheck" data-i18n="setup.recheck"></button>
      <button class="primary" id="setup-back" data-i18n="btn.back"></button>
    </div>
  </main>

  <!-- ===== История и траты ===== -->
  <main id="screen-history" hidden>
    <h1 data-i18n="history.title"></h1>
    <div class="stale-note" data-i18n="app.updating"></div>
    <div class="tabs" id="history-tabs"></div>
    <div class="sub" id="history-summary" data-i18n="history.loading"></div>
    <section class="card stats" id="history-stats" hidden>
      <div><div class="label" data-i18n="history.spent"></div><div class="big" id="h-spent"></div></div>
      <div><div class="label" data-i18n="history.hours"></div><div class="big" id="h-hours"></div></div>
      <div><div class="label" data-i18n="history.sessions"></div><div class="big" id="h-count"></div></div>
      <div><div class="label" data-i18n="history.per_hour"></div><div class="big" id="h-per-hour"></div></div>
    </section>
    <div class="sub" id="history-breakdown"></div>
    <section class="card table-card" id="history-card" hidden>
      <table id="history-table">
        <thead><tr>
          <th data-i18n="col.date"></th><th data-i18n="col.machine"></th>
          <th class="num" data-i18n="col.hours"></th><th class="num" data-i18n="col.cost"></th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </section>
    <div class="note" id="history-other" hidden><span></span> <a href="#" id="history-other-toggle"></a></div>
    <div class="note" data-i18n="history.note"></div>
    <div class="error" id="history-error" hidden></div>
    <div class="actions"><button class="primary" id="history-back" data-i18n="btn.back"></button></div>
  </main>

  <!-- ===== Библиотека Steam ===== -->
  <main id="screen-library" hidden>
    <div class="lib-top">
      <h1 data-i18n="library.title"></h1>
      <button class="small" id="library-refresh" data-i18n="library.refresh" hidden></button>
    </div>
    <div class="sub" id="library-summary"></div>
    <section class="card lib-empty" id="library-empty" hidden>
      <div class="title" data-i18n="library.empty.title"></div>
      <div class="sub" data-i18n="library.empty.text"></div>
      <button class="primary" id="library-login" data-i18n="steam.login"></button>
      <div class="sub" id="library-login-msg" hidden></div>
    </section>
    <input type="search" id="library-search" data-i18n-placeholder="library.search" hidden>
    <div class="lib-chips" id="library-chips"></div>
    <div class="lib-grid" id="library-grid"></div>
    <div class="note" id="library-soon" data-i18n="library.hint" hidden></div>
    <div class="error" id="library-error" hidden></div>
    <div class="actions"><button id="library-back" data-i18n="btn.back"></button></div>
  </main>

  <!-- ===== Игры в облаке ===== -->
  <main id="screen-games" hidden>
    <h1 data-i18n="games.title"></h1>
    <div class="stale-note" data-i18n="app.updating"></div>
    <div class="sub" id="games-summary" data-i18n="games.loading"></div>
    <section class="card attention" id="games-ts" hidden>
      <div class="title" data-i18n="tailscale.title"></div>
      <div class="sub" data-i18n="tailscale.text"></div>
      <button class="primary" id="games-ts-open" data-i18n="tailscale.open"></button>
    </section>
    <input type="search" id="games-search" data-i18n-placeholder="games.search" hidden>
    <section class="card table-card" id="games-card" hidden>
      <table id="games-table">
        <thead>
          <tr>
            <th data-i18n="col.kind"></th>
            <th data-i18n="col.title"></th>
            <th class="num" data-i18n="col.size"></th>
            <th class="num" data-i18n="col.changed"></th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
    <div class="note" id="games-service"></div>
    <div class="note" id="games-status" hidden></div>
    <div class="error" id="games-error" hidden></div>
    <div class="actions">
      <button id="games-back" data-i18n="btn.back"></button>
    </div>
  </main>

  <!-- ===== Ход операции (запуск или завершение) ===== -->
  <main id="screen-progress" hidden>
    <!-- Игра из библиотеки: широкая картинка игры, на ней название и время (вместо заголовка) -->
    <section class="game-banner" id="progress-banner" hidden>
      <img id="progress-banner-img" alt="">
      <div class="shade"></div>
      <div class="gb-text"><h1 id="progress-banner-title"></h1><div class="sub" id="progress-banner-sub"></div></div>
    </section>
    <h1 id="progress-title"></h1>
    <div class="sub" id="progress-elapsed"></div>
    <div class="warn-line" id="progress-alert" hidden></div>
    <section class="card attention" id="tailscale-box" hidden>
      <div class="title" data-i18n="tailscale.title"></div>
      <div class="sub" data-i18n="tailscale.text"></div>
      <button class="primary" id="tailscale-open" data-i18n="tailscale.open"></button>
    </section>
    <section class="card">
      <ol class="stages" id="stages"></ol>
    </section>
    <section class="card" id="archives-card" hidden>
      <ul class="archives" id="archives"></ul>
    </section>
    <div class="note" id="progress-note"></div>
    <section class="card" id="progress-result" hidden></section>
    <div class="error" id="progress-error" hidden></div>
    <details class="details">
      <summary data-i18n="progress.details"></summary>
      <pre id="progress-log"></pre>
    </details>
    <div class="actions">
      <button class="primary" id="progress-offers" hidden data-i18n="offers.back_to_list"></button>
      <button class="primary" id="progress-back" hidden data-i18n="btn.back"></button>
      <button id="progress-home" hidden data-i18n="progress.home"></button>
      <button id="progress-replace" hidden data-i18n="task.replace"></button>
      <button class="danger" id="progress-cancel" hidden data-i18n="progress.cancel"></button>
    </div>
  </main>

  <!-- ===== Вопрос (да/нет) ===== -->
  <div class="modal" id="modal" hidden>
    <div class="dialog">
      <div class="title" id="modal-title"></div>
      <div class="modal-text" id="modal-text"></div>
      <div class="actions">
        <button class="primary" id="modal-yes"></button>
        <button id="modal-no"></button>
      </div>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
